<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" fill="none">
  <defs>
    <linearGradient id="nc-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EB638B" />
      <stop offset="100%" stop-color="#AC274F" />
    </linearGradient>
    <linearGradient id="nc-grad-path" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AC274F" />
      <stop offset="50%" stop-color="#EB638B" />
      <stop offset="100%" stop-color="#FFD9DA" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#AC274F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background container optional/clean transparent -->

  <!-- Brand Emblem (Geometric 'N' with campus connectivity nodes and pathway perspective) -->
  <g transform="translate(16, 12)" filter="url(#subtle-glow)">
    <!-- Outer rounded base hexagon / diamond shield subtle framing -->
    <rect x="0" y="0" width="96" height="96" rx="24" fill="#382E31" stroke="rgba(235,99,139,0.25)" stroke-width="1.5"/>
    
    <!-- Path Grid / Coordinate lines inside badge -->
    <path d="M18 48 H78 M48 18 V78" stroke="rgba(255,217,218,0.08)" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Isometric Connected 'N' Node Structure -->
    <!-- Left vertical pathway column -->
    <path d="M30 70 V26" stroke="url(#nc-grad-primary)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Diagonal intersecting transit corridor / campus axis -->
    <path d="M30 26 L66 70" stroke="url(#nc-grad-path)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Right vertical column with connected node tip -->
    <path d="M66 70 V26" stroke="url(#nc-grad-primary)" stroke-width="7" stroke-linecap="round"/>

    <!-- Campus Nodes / Waypoints -->
    <circle cx="30" cy="26" r="4.5" fill="#FFD9DA" stroke="#AC274F" stroke-width="2"/>
    <circle cx="66" cy="70" r="4.5" fill="#FFD9DA" stroke="#AC274F" stroke-width="2"/>
    <circle cx="48" cy="48" r="3.5" fill="#EB638B"/>
    <circle cx="66" cy="26" r="3" fill="rgba(255,217,218,0.7)"/>
    <circle cx="30" cy="70" r="3" fill="rgba(255,217,218,0.7)"/>
  </g>

  <!-- Wordmark "NextCampus" -->
  <g transform="translate(132, 28)">
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.03em" fill="#FFFFFF">Next<tspan fill="#EB638B">Campus</tspan></text>
    <!-- Tagline & Hackathon Subtitle -->
    <text x="2" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.16em" text-transform="uppercase" fill="#FFD9DA" fill-opacity="0.8">Smart Campus Platform</text>
  </g>
</svg>
